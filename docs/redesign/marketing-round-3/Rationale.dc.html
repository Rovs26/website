<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>KitaMo site · Rationale</title><style>@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;font-display:swap;src:url(assets/fonts/schibsted-grotesk-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20B0,U+20B2-20C0,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:"Schibsted Grotesk";font-weight:100 900;font-display:swap;src:url(assets/fonts/hanken-grotesk-peso.woff2) format("woff2");unicode-range:U+20B1}@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;font-display:swap;src:url(assets/fonts/schibsted-grotesk-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}body{margin:0;background:#e9e7e1}*{box-sizing:border-box}a{color:#006b3c}a:hover{color:#004e2c}h1,h2,h3,p,ol,ul,dl,dd{margin:0}ol,ul{padding:0;list-style:none}</style></helmet>
<article data-screen-label="Rationale" style="max-width:1120px;margin:32px auto;background:#f7f6f2;color:#161a17;font-family:'Schibsted Grotesk',system-ui,sans-serif;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;gap:40px">
<header style="display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:8px solid #e3a008">
<span style="font-size:15px;font-weight:600;color:#545b55">kitamo.online · 1b Counter and resibo</span>
<h1 style="font-size:clamp(36px,4.4vw,52px);line-height:1.02;font-weight:700;letter-spacing:-0.035em">Rationale</h1>
</header>

<section aria-labelledby="c-h" style="display:flex;flex-direction:column;gap:16px">
<h2 id="c-h" style="font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-0.015em">How 1b avoids each cliché on the list</h2>
<dl style="border-top:1px solid #161a17">
<sc-for list="{{ cliches }}" as="c" hint-placeholder-count="11"><div style="display:flex;flex-wrap:wrap;gap:4px 32px;padding:12px 0;border-bottom:1px solid #dcdbd3">
<dt style="flex:1 1 240px;font-size:16px;line-height:1.4;font-weight:700">{{ c.q }}</dt>
<dd style="flex:2 1 420px;font-size:16px;line-height:1.45;font-weight:500;text-wrap:pretty">{{ c.a }}</dd>
</div></sc-for>
</dl>
</section>

<section aria-labelledby="t-h" style="display:flex;flex-direction:column;gap:16px">
<h2 id="t-h" style="font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-0.015em">Why a seller would tap Create free account</h2>
<ol style="border-top:1px solid #161a17">
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="6"><li style="display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #dcdbd3;font-size:16px;line-height:1.45;font-weight:500;text-wrap:pretty"><span style="font-weight:700;font-variant-numeric:tabular-nums">{{ r.n }}</span><span><strong style="font-weight:700">{{ r.lead }}</strong> {{ r.text }}</span></li></sc-for>
</ol>
</section>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CLICHES = [
  ["Hero gradients, gradient text, glassmorphism, grain", "Flat paper and flat ink. The only colour accent is a solid 8 px gold counter edge. The K mark keeps its own gradient, and the gradient goes nowhere else."],
  ["A badge above the headline", "The H1 is the first thing under the header. “Free while in testing” is plain text under the buttons."],
  ["Emoji in headings", "None. Headings are seller words: Benta, Paninda, Utang, Gastos, Kita."],
  ["Three icon boxes in a row", "The routine shows five real app screens. For sellers is a type-led list. There are no icons in the content."],
  ["The default shadcn look, Lucide icons everywhere", "No cards and no shadows. Radius only on buttons. The site uses two custom icons, a chevron and an arrow."],
  ["Fade-on-scroll everywhere, cursor effects", "One motion on the whole page: the receipt's double rule draws in once, in 240 ms. Nothing fades in, and everything is visible without JavaScript."],
  ["Serif-italic accents, Inter", "One family, Schibsted Grotesk, at 500, 600 and 700. Emphasis comes from size and weight."],
  ["Buzzwords: seamless, empower, all-in-one, revolutionize", "The copy names tasks: sell, track stock, give sukli, log utang. None of the listed words appear."],
  ["Em dashes everywhere", "None in the page copy. The formula uses the true minus sign."],
  ["A disclaimer in every section", "Limits live in two places: Straight answers on the homepage and “What KitaMo doesn't do” on How it works. Device bands carry one caption about sample data."],
  ["The same bordered card for everything", "Structure comes from three different things, each with its own job: ruled lista lines for lists, the white receipt for the formula, and the dark counter band for devices and the call to action."],
];
const REASONS = [
  ["It looks like their counter.", "The first screen shows a tablet and a phone standing on a counter, with the day's profit on screen in pesos."],
  ["It speaks their words.", "“Your lista, with the math done” compares KitaMo to the notebook they already keep. Benta, utang and sukli need no translation."],
  ["The math is shown, not promised.", "The receipt works one real day through to Tubo ₱1,335.00, and says KitaMo will flag a missing cost instead of guessing."],
  ["The risk is stated next to the button.", "Free while in testing, works in the browser, English or Filipino. There is nothing to download."],
  ["Doubts are answered before they are asked.", "Internet, payments, BIR, price and the Android app each get a one-line answer."],
  ["The button is easy to find and easy to hit.", "It is the only green block, 56 to 60 px tall, and appears after the hero, the three steps and the close. The Filipino label fits on one line at 360 px."],
];
class Component extends DCLogic {
  renderVals() {
    return {
      cliches: CLICHES.map(([q, a]) => ({ q, a, span: 2 })),
      reasons: REASONS.map(([lead, text], i) => ({ n: i + 1, lead, text })),
    };
  }
}
</script>
</body>
</html>
