<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;font-display:swap;src:url(assets/fonts/schibsted-grotesk-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20B0,U+20B2-20C0,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:"Schibsted Grotesk";font-weight:100 900;font-display:swap;src:url(assets/fonts/hanken-grotesk-peso.woff2) format("woff2");unicode-range:U+20B1}@font-face{font-family:"Schibsted Grotesk";font-weight:400 800;font-display:swap;src:url(assets/fonts/schibsted-grotesk-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}body{margin:0}*{box-sizing:border-box}</style></helmet>
<div data-screen-label="P1 Benta phone" style="width:390px;height:845px;display:flex;flex-direction:column;overflow:hidden;background:#f7f6f2;color:#161a17;font-family:'Schibsted Grotesk',system-ui,sans-serif;font-variant-numeric:lining-nums">
<div style="height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13.5px;font-weight:600">
<span>2:40</span>
<span style="display:flex;align-items:center;gap:7px"><span style="display:flex;align-items:flex-end;gap:2px;height:11px"><span style="width:3px;height:4px;background:#161a17;border-radius:1px"></span><span style="width:3px;height:6px;background:#161a17;border-radius:1px"></span><span style="width:3px;height:8px;background:#161a17;border-radius:1px"></span><span style="width:3px;height:11px;background:#161a17;border-radius:1px"></span></span><span style="font-size:12px">4G</span><span style="display:flex;align-items:center"><span style="width:22px;height:11px;border:1.5px solid #161a17;border-radius:3px;padding:1px;display:flex"><span style="width:72%;background:#161a17;border-radius:1px"></span></span><span style="width:2px;height:5px;background:#161a17;border-radius:0 1px 1px 0"></span></span></span>
</div>
<header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid #dcdbd3;background:#f7f6f2">
<img src="assets/icon-192.png" width="28" height="28" alt="KitaMo">
<span style="flex:1;min-width:0;font-size:17px;font-weight:700">Sell</span>
<span style="width:44px;height:44px;display:grid;place-items:center"><span style="width:34px;height:34px;border-radius:50%;border:1px solid #858379;background:#fff;display:grid;place-items:center;font-size:14px;font-weight:700">N</span></span>
</header>
<div style="flex:1;min-height:0;overflow:hidden;padding:10px 16px 0;display:flex;flex-direction:column">
<span style="height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border:1px solid #858379;border-radius:10px"><span style="font-size:18px;display:flex;color:#545b55">{{ ic.search }}</span><span style="font-size:15px;color:#545b55">Search products</span></span>
<div style="display:flex;gap:6px;overflow:hidden;flex-shrink:0;padding:10px 0">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><span style="flex-shrink:0;height:44px;padding:0 14px;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};display:flex;align-items:center;gap:6px;font-size:14px;font-weight:{{ c.fw }};white-space:nowrap"><sc-if value="{{ c.star }}" hint-placeholder-val="{{ false }}"><span style="display:flex;font-size:15px">{{ ic.star }}</span></sc-if>{{ c.label }}</span></sc-for>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<sc-for list="{{ shelf }}" as="p" hint-placeholder-count="8">
<div style="position:relative;min-height:100px;display:flex;flex-direction:column;padding:{{ p.pad }};border-radius:14px;background:{{ p.bg }};border:{{ p.border }}">
<span style="font-size:15px;font-weight:600;line-height:1.2;flex-shrink:0;padding-right:30px">{{ p.name }}</span><span style="flex:1"></span>
<span style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:#545b55"><sc-if value="{{ p.low }}" hint-placeholder-val="{{ false }}"><span style="background:#fde8c8;color:#6d4100;border-radius:999px;padding:1px 7px;font-size:11.5px;font-weight:650">Low</span></sc-if>{{ p.stock }}</span>
<span style="font-size:19px;font-weight:700">{{ p.price }}</span>
<sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:#0d4f33;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700">{{ p.qty }}</span></sc-if>
</div>
</sc-for>
</div>
</div>
<div style="flex-shrink:0;padding:10px 16px;background:#f7f6f2;border-top:1px solid #dcdbd3">
<span style="height:56px;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;background:#006b3c;color:#fff;border-radius:12px;font-size:16px;font-weight:700"><span style="min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:#fff;color:#006b3c;display:grid;place-items:center;font-size:14px">10</span><span style="flex:1">₱183.00</span>Checkout<span style="display:flex;font-size:20px">{{ ic.arrow }}</span></span>
</div>
<nav aria-label="Main" style="height:64px;flex-shrink:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #dcdbd3;background:#f7f6f2;padding-bottom:4px">
<sc-for list="{{ tabs }}" as="n" hint-placeholder-count="5"><span style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:{{ n.fw }};color:{{ n.fg }}"><span style="position:absolute;top:-1px;left:22%;right:22%;height:2px;background:{{ n.bd }}"></span><span style="font-size:22px;display:flex;color:{{ n.ic }}">{{ n.icon }}</span>{{ n.label }}</span></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:845}}">
const IC = {
  kita: ["M5 5v14M9 5v14M13 5v14M17 5v14M3 16.5 21 8"], benta: ["M4.5 9h15l-1.3 10.2a1 1 0 0 1-1 .8H6.8a1 1 0 0 1-1-.8Z", "M9 9V7a3 3 0 0 1 6 0v2"],
  paninda: ["M2.5 20.5h19", "M4 12h7v8.5H4z", "M13 15h7v5.5h-7z", "M5.5 4H11v8H5.5z"], gastos: ["M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z", "M9 8h6M9 12h6M9 16h3"],
  utang: ["M7 3h10.5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7z", "M4 7h3M4 12h3M4 17h3M11 8h4.5M11 12h4.5"],
  search: ["M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0", "M16 16l4.5 4.5"], arrow: ["M5 12h14M13 6l6 6-6 6"],
  star: ["M12 3.8l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5 2.7 1-5.6-4.1-3.9 5.6-.8z"],
};
const P = [["Pancit canton", 18, 37, 3], ["Kape 3-in-1", 12, 6, 0, 1], ["Itlog", 9, 54, 6], ["Softdrinks 1.5L", 75, 11, 1], ["Bigas 1 kg", 54, 20, 0], ["Sabon", 25, 14, 0], ["Tinapay", 5, 8, 0, 1], ["Yelo", 10, 30, 0]];
class Component extends DCLogic {
  icon(k) { const h = React.createElement; return h("svg", { width: "1em", height: "1em", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true }, ...IC[k].map((d, i) => h("path", { key: i, d }))); }
  renderVals() {
    const ic = {}; Object.keys(IC).forEach((k) => (ic[k] = this.icon(k)));
    const cats = ["Favourites", "All", "Drinks", "Snacks"].map((c, i) => ({ label: c, star: i === 0, bg: i === 0 ? "#0d4f33" : "#fff", fg: i === 0 ? "#fff" : "#161a17", bd: i === 0 ? "#0d4f33" : "#858379", fw: i === 0 ? 700 : 520 }));
    const shelf = P.map((p) => ({ name: p[0], price: "₱" + p[1].toFixed(2), stock: p[2] + " left", low: !!p[4], inCart: p[3] > 0, qty: p[3], bg: p[3] ? "#e1efe6" : "#fff", border: p[3] ? "2px solid #0d4f33" : "1px solid #858379", pad: p[3] ? "7px 9px" : "8px 10px" }));
    const L = { kita: "Profit", benta: "Sell", paninda: "Products", gastos: "Expenses", utang: "Credit" };
    const tabs = Object.keys(L).map((k) => { const on = k === "benta"; return { label: L[k], icon: ic[k], fw: on ? 700 : 560, fg: on ? "#161a17" : "#545b55", ic: on ? "#006b3c" : "#545b55", bd: on ? "#161a17" : "transparent" }; });
    return { ic, cats, shelf, tabs };
  }
}
</script>
</body>
</html>
